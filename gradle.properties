org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Compile Kotlin inside each Gradle process instead of the shared Kotlin daemon. Android Studio and command-line
# Gradle used to share one Kotlin daemon and corrupt each other's incremental caches ("Storage for lookups.tab is
# already registered" -> "Daemon compilation failed: null").
kotlin.compiler.execution.strategy=in-process
